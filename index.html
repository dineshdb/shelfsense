<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#eef2f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>ShelfSense AI · Smart Retail Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<style>:root{
  --bg:#eef2f7;--card:#ffffff;--ink:#0b1220;--ink2:#334155;--mute:#64748b;--line:#e6ebf2;
  --brand:#10b981;--brand2:#06b6d4;--brand3:#6366f1;--deep:#0b1220;
  --ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--slow:#8b5cf6;
  --r:20px;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --grad:linear-gradient(135deg,#10b981 0%,#06b6d4 55%,#6366f1 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px;
  background:radial-gradient(1200px 600px at 10% -10%,#d1fae5 0,transparent 60%),radial-gradient(900px 600px at 110% 10%,#e0e7ff 0,transparent 55%),var(--bg);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@media(min-width:620px){
  body{padding:28px 0}
  .shell{min-height:calc(100vh - 56px);border-radius:34px;box-shadow:0 30px 80px rgba(15,23,42,.18),0 0 0 10px #0b1220;overflow:hidden}
  .nav{border-radius:0 0 34px 34px}
}
/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  background:rgba(238,242,247,.82);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(226,232,240,.7)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.35);flex:0 0 42px}
.logo svg{width:22px;height:22px}
.brand h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:1px 0 0;font-size:12px;color:var(--mute);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:#fff;border:1px solid var(--line);white-space:nowrap;box-shadow:var(--sh)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.pill.off i{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
main{padding:14px 14px 0}
.view{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;margin-bottom:14px;
  background:radial-gradient(400px 200px at 100% 0,rgba(99,102,241,.55),transparent 60%),radial-gradient(300px 220px at 0 100%,rgba(16,185,129,.55),transparent 60%),#0b1220;
  box-shadow:0 18px 40px rgba(11,18,32,.28)}
.hero .g{font-size:13px;opacity:.75;font-weight:600}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.hero .sm{font-size:12.5px;opacity:.75}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ring{--p:0;width:86px;height:86px;border-radius:50%;flex:0 0 86px;display:grid;place-items:center;
  background:conic-gradient(#34d399 calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
.ring>div{width:68px;height:68px;border-radius:50%;background:#0f172a;display:grid;place-items:center;text-align:center}
.ring b{font-size:19px;display:block;line-height:1}
.ring small{font-size:9.5px;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hstats div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px}
.hstats b{display:block;font-size:16px}
.hstats span{font-size:11px;opacity:.7}
/* ---------- quick actions ---------- */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qa button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.qa button:active{transform:scale(.96)}
.qa .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff}
.qa .ic svg{width:21px;height:21px}
/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px;border:1px solid rgba(226,232,240,.8)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.ch .sub{font-size:12px;color:var(--mute);font-weight:600}
.ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 30px}
.t-ok{background:#d1fae5}.t-warn{background:#fef3c7}.t-bad{background:#fee2e2}.t-slow{background:#ede9fe}.t-info{background:#e0f2fe}.t-ind{background:#e0e7ff}
.muted{color:var(--mute);font-size:13px}
.small{font-size:12px}
.empty{text-align:center;color:var(--mute);padding:22px 10px;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:6px}
/* ---------- rows ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:#f8fafc;border:1px solid #eef2f6}
.em{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex:0 0 44px}
.mid{flex:1;min-width:0}
.tt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.ss{font-size:12px;color:var(--mute);margin-top:2px}
.rt{text-align:right;flex:0 0 auto}
.bar{height:6px;background:#e7edf3;border-radius:9px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:9px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.b-ok{background:#d1fae5;color:#047857}.b-low{background:#fef3c7;color:#b45309}.b-out{background:#fee2e2;color:#b91c1c}.b-slow{background:#ede9fe;color:#6d28d9}.b-new{background:#e0f2fe;color:#0369a1}
.order{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.order:last-child{border-bottom:0}
.order .q{font-weight:800;font-size:15px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#ecfdf5,#eef2ff);font-weight:700}
.total b{font-size:18px}
/* ---------- buttons ---------- */
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;transition:.15s;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);box-shadow:0 8px 20px rgba(6,182,212,.3)}
.btn.sec{background:#f1f5f9;color:var(--ink)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.danger{background:#fef2f2;color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mt{margin-top:10px}.mt2{margin-top:16px}
.flex{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
/* ---------- forms ---------- */
.f{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:#fff;outline:none;transition:.15s}
.f:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(6,182,212,.14)}
.lb{display:block;font-size:11.5px;font-weight:800;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.search .f{padding-left:40px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.tg{width:48px;height:29px;border-radius:99px;background:#cbd5e1;position:relative;cursor:pointer;flex:0 0 48px;transition:.2s;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg.on{background:var(--brand)}.tg.on::after{left:22px}
.qb{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:18px;cursor:pointer;color:var(--ink);display:grid;place-items:center}
.qb:active{transform:scale(.92)}
/* ---------- scan ---------- */
.viewer{position:relative;border-radius:20px;overflow:hidden;background:#0b1220;min-height:250px;display:grid;place-items:center}
.viewer video,.viewer img{width:100%;display:block}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ph{color:#94a3b8;text-align:center;padding:34px 24px;font-size:13.5px;line-height:1.5}
.ph .scanico{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;background:rgba(255,255,255,.06);display:grid;place-items:center;border:1px solid rgba(255,255,255,.1)}
.ph .scanico svg{width:36px;height:36px;color:#34d399}
.corner{position:absolute;width:26px;height:26px;border:3px solid #34d399;opacity:.9}
.c1{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}.c2{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.c3{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 8px}.c4{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.laser{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#34d399,transparent);box-shadow:0 0 12px #34d399;animation:las 2.2s ease-in-out infinite}
@keyframes las{0%,100%{top:12%}50%{top:86%}}
.busy{position:absolute;inset:0;background:rgba(11,18,32,.72);backdrop-filter:blur(3px);display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:20px;font-size:14px}
.spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.2);border-top-color:#34d399;border-radius:50%;animation:sp .9s linear infinite;margin:0 auto 12px}
.spin.dk{border-color:#e2e8f0;border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(360deg)}}
.det{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px;border:1px solid #eef2f6;border-radius:16px;background:#f8fafc}
.det input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);margin-top:12px}
.det .rowf{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:6px;margin-top:8px}
.det .f{padding:9px 10px;font-size:14px}
/* ---------- voice ---------- */
.voice{text-align:center;padding:8px 0 4px}
.micbtn{width:136px;height:136px;border-radius:50%;border:0;cursor:pointer;position:relative;color:#fff;margin:10px auto 0;display:grid;place-items:center;
  background:var(--grad);box-shadow:0 18px 40px rgba(6,182,212,.4),inset 0 -6px 18px rgba(0,0,0,.15)}
.micbtn svg{width:50px;height:50px}
.micbtn.on{background:linear-gradient(135deg,#ef4444,#f97316);box-shadow:0 18px 40px rgba(239,68,68,.4)}
.micbtn.on::before,.micbtn.on::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(239,68,68,.5);animation:pulse 1.5s ease-out infinite}
.micbtn.on::after{animation-delay:.75s}
@keyframes pulse{from{transform:scale(.88);opacity:1}to{transform:scale(1.38);opacity:0}}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:30px;margin-top:16px}
.wave i{width:4px;border-radius:4px;background:#cbd5e1;height:6px}
.wave.on i{background:var(--bad);animation:wv 1s ease-in-out infinite}
.wave.on i:nth-child(2n){animation-delay:.15s}.wave.on i:nth-child(3n){animation-delay:.3s}.wave.on i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:6px}50%{height:28px}}
.trans{min-height:52px;margin-top:8px;font-size:19px;font-weight:700;letter-spacing:-.3px;padding:0 10px;color:var(--ink)}
.trans.ph2{color:var(--mute);font-weight:600;font-size:14.5px}
.inrow{display:flex;gap:8px}.inrow .f{flex:1}
.ex{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
.ex button{border:1px dashed #a5b4fc;background:#eef2ff;color:#4338ca;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}
.pi{display:grid;grid-template-columns:72px 80px 1fr;gap:6px;margin-bottom:8px}
.pi .f{padding:10px;font-size:14px}
/* ---------- chart ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:9px;fill:#94a3b8;font-family:inherit}
/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
@media(min-width:620px){.nav{bottom:28px}}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#94a3b8;padding:4px 0;cursor:pointer}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--brand)}
.nav .fabm{width:60px;height:60px;margin:-30px auto 0;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(6,182,212,.45);border:4px solid #fff;transform:rotate(0)}
.nav .fabm svg{width:26px;height:26px;color:#fff!important}
.fab{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));right:max(16px,calc(50% - 224px));z-index:25}
@media(min-width:620px){.fab{bottom:136px}}
.fab .btn{width:56px;height:56px;border-radius:18px;font-size:28px;padding:0}
/* ---------- sheet / toasts ---------- */
.sheetbg{position:fixed;inset:0;background:rgba(11,18,32,.55);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#e2e8f0;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0b1220;color:#fff;padding:12px 14px;border-radius:15px;font-weight:600;font-size:13.5px;box-shadow:0 14px 34px rgba(0,0,0,.25);animation:tin .25s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:flex-start}
.toast.ok{background:#065f46}.toast.warn{background:#92400e}.toast.err{background:#991b1b}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
.ai{white-space:pre-wrap;line-height:1.55;font-size:14px;color:var(--ink2);background:linear-gradient(135deg,#f0fdfa,#eef2ff);border-radius:14px;padding:14px}
.onb{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.onb div{display:flex;gap:12px;align-items:center;font-size:13.5px;font-weight:600;color:var(--ink2)}
.onb span{width:30px;height:30px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;font-weight:800;flex:0 0 30px}
</style>
<style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:#f8fafc;border:1px solid #eef2f6;border-radius:14px;padding:8px 6px;text-align:center}
.stats b{display:block;font-size:15px}.stats span{font-size:10.5px;color:var(--mute);font-weight:600}
.h3{margin:16px 0 8px;font-size:14px;font-weight:800}</style><script>

<script>/* ===== ShelfSense Core: voice parsing, product matching, analytics (pure functions) ===== */
const Core = (() => {

    five: 5, cinco: 5, six: 6, seis: 6, seven: 7, siete: 7, eight: 8, ocho: 8, nine: 9, nueve: 9, ten: 10, diez: 10,
    eleven: 11, once: 11, twelve: 12, doce: 12, fifteen: 15, quince: 15, twenty: 20, veinte: 20, thirty: 30, treinta: 30,
    fifty: 50, cincuenta: 50, hundred: 100, cien: 100, half: 0.5, medio: 0.5, media: 0.5, quarter: 0.25, cuarto: 0.25,
    couple: 2, par: 2 };
  const UNIT_RULES = [

    'reponer', 'repuse', 'entrada', 'ingreso']);
  const STOP = new Set(['of', 'de', 'del', 'the', 'el', 'la', 'los', 'las', 'i', 'we', 'yo', 'just', 'have', 'has',
    'been', 'was', 'were', 'se', 'please', 'por', 'favor', 'for', 'to', 'customer', 'cliente', 'today', 'hoy', 'more',

    'it', 'is', 'are', 'my', 'mi', 'al', 'lo', 'le', 'les', 'item', 'items', 'product', 'producto', 'plushalf']);

function chart(s) {

  [0, .5, 1].forEach(f => { const y = 6 + (H - 6) * (1 - f); g += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#eef2f6"/><text x="0" y="${y + 3}">${Math.round(max * f)}</text>`; });
  s.forEach((x, i) => {
    const bh = Math.max(2, (H - 6) * x.value / max), X = pad + i * bw + bw * .18, last = i === s.length - 1;
    g += `<rect x="${X}" y="${H - bh}" width="${bw * .64}" height="${bh}" rx="4" fill="${last ? 'url(#bg1)' : '#cdeee6'}"><title>${x.label}: ${money(x.value)}</title></rect>`;
    if (i % 2 === (s.length - 1) % 2) g += `<text x="${X + bw * .32}" y="${H + 14}" text-anchor="middle">${x.label.split(' ').reverse().join(' ')}</text>`;
  });
  return g + '</svg>';
}

  P.forEach(([name, category, unit, stock, price, cost, rate, aliases], k) => {
    const id = 'p' + k; S.products.push({ id, name, category, unit, stock, price, cost, aliases, minStock: null, createdAt: now - 22 * DAY });
    for (let d = 21; d >= 0; d--) {
      const day = new Date(now - d * DAY), wk = [0, 6].includes(day.getDay()) ? 1.35 : 1, ramp = name.startsWith('Coca') ? .7 + (21 - d) / 35 : 1;
      let q = rate * wk * ramp * (.5 + R()); if (d === 0) q *= Math.min(1, (new Date().getHours() + 1) / 20);
      const tx = Math.max(0, Math.round(q / (unit === 'kg' ? 1.5 : 2)));
      for (let t = 0; t < tx; t++) {
        const qq = unit === 'kg' ? Math.max(.25, Math.round(q / tx * 4) / 4) : Math.max(1, Math.round(q / tx));
        const ts = new Date(day); ts.setHours(7 + Math.floor(R() * 12), Math.floor(R() * 60), 0, 0); if (ts.getTime() > now) continue;
        S.moves.push({ id: uid(), productId: id, type: 'sale', qty: qq, delta: -qq, unitPrice: price, total: +(qq * price).toFixed(2), ts: ts.getTime(), source: 'demo' });
      }
    }
  });
  if (S.settings.storeName === DEF.storeName) S.settings.storeName = 'Abarrotes La Esquina';
  U.ai.text = ''; save(); go('home'); toast('✨ Demo store loaded — 14 products, 3 weeks of sales', 'ok');
}
function quick(id, type) {
  const p = prod(id), step = p.unit === 'g' || p.unit === 'ml' ? 100 : 1;
  if (type === 'sale') { if (p.stock <= 0) return toast(p.name + ' is out of stock', 'warn'); const q = Math.min(step, p.stock); p.stock = +(p.stock - q).toFixed(3);
    S.moves.push({ id: uid(), productId: id, type: 'sale', qty: q, delta: -q, unitPrice: p.price, total: +(q * p.price).toFixed(2), ts: Date.now(), source: 'manual' }); }
  else { p.stock = +(p.stock + step).toFixed(3); S.moves.push({ id: uid(), productId: id, type: 'restock', qty: step, delta: step, ts: Date.now(), source: 'manual' }); }
  save(); $('#stocklist').innerHTML = stockList();
}
function saveP() {
  const e = U.edit, g = id => $('#' + id).value, name = g('e_name').trim(); if (!name) return toast('Name is required', 'warn');
  const d = { name, aliases: g('e_alias').split(',').map(s => s.trim()).filter(Boolean), category: g('e_cat'), unit: g('e_unit'), stock: +g('e_stock') || 0, minStock: g('e_min') === '' ? null : +g('e_min'), price: +g('e_price') || 0, cost: +g('e_cost') || 0 };
  if (e.id) { const p = prod(e.id), b = p.stock; Object.assign(p, d); if (b !== p.stock) S.moves.push({ id: uid(), productId: p.id, type: 'adjust', qty: +(p.stock - b).toFixed(3), delta: +(p.stock - b).toFixed(3), ts: Date.now(), source: 'edit' }); }
  else S.products.push({ id: uid(), createdAt: Date.now(), ...d });
  U.edit = null; save(); render(); toast('Saved', 'ok');
}

/* =========================================================== EVENTS */
const ACT = {
  tab: el => go(el.dataset.v), demo, share, advisor,
  cam: startCam, camoff: () => { stopCam(); render(); }, capture, live: toggleLive, esp, rescan: () => { U.scan.image = null; U.scan.dets = []; render(); },
  pick: el => $('#' + el.dataset.v).click(), commit: el => commit(el.dataset.v),
  listen, typed: () => { const t = $('#typed').value.trim(); if (t) command(t, 'typed'); }, ex: el => command(el.dataset.v, 'typed'),
  apply, cancelParse: () => { U.voice.parsed = null; render(); },
  undo: el => { const m = S.moves.find(x => x.id === el.dataset.v); if (!m) return; const p = prod(m.productId); if (p) p.stock = Math.max(0, +(p.stock - (m.delta ?? (m.type === 'sale' ? -m.qty : m.qty))).toFixed(3)); S.moves = S.moves.filter(x => x !== m); save(); render(); toast('↩️ Undone'); },
  cat: el => { U.inv.cat = el.dataset.v; render(); }, sort: el => { U.inv.sort = el.dataset.v; render(); }, qm: el => quick(el.dataset.v, el.dataset.t),
  invCsv: () => {
    const rows = A().rows.sort((a, b) => a.p.name.localeCompare(b.p.name));
    const cell = x => `"${String(x ?? '').replace(/"/g, '""')}"`;
    const csv = ['Name,Category,Unit,Stock,MinStock,Price,Cost,Value,Status']
      .concat(rows.map(r => [r.p.name, r.p.category || 'Other', r.p.unit, r.p.stock, r.p.minStock ?? '', r.p.price, r.p.cost ?? '',
        (Math.max(0, r.p.stock) * (r.p.cost || r.p.price * .75 || 0)).toFixed(2), r.status].map(cell).join(','))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `inventory-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    toast('📊 Inventory CSV downloaded', 'ok');
  },
  adjustStock: () => {
    const e = U.edit, p = e && prod(e.id); if (!p) return toast('Save the product first', 'warn');
    const mode = $('#a_mode').value, q = +$('#a_qty').value, note = $('#a_note').value.trim();
    if (!(q > 0)) return toast('Enter a quantity', 'warn');
    if (mode === 'remove' && q > p.stock) return toast(`Only ${fq(p.stock, p.unit)} in stock`, 'warn');
    const b = p.stock;
    const ns = Math.max(0, +(mode === 'set' ? q : mode === 'add' ? b + q : b - q).toFixed(3));
    const delta = +(ns - b).toFixed(3);
    p.stock = ns; e.stock = ns;
    S.moves.push({ id: uid(), productId: p.id, type: 'adjust', qty: Math.abs(delta), delta, ts: Date.now(), source: 'adjust', text: note || `${mode} ${q}` });
    save(); $('#e_stock').value = ns; $('#a_qty').value = ''; $('#a_note').value = '';
    $('#sheet').innerHTML = vSheet();
    $('#stocklist').innerHTML = stockList();
    toast(`✅ ${p.name}: ${delta >= 0 ? '+' : '−'}${fq(Math.abs(delta), p.unit)} — now ${fq(ns, p.unit)}`, 'ok');
  },
  edit: el => { const p = prod(el.dataset.v); U.edit = p ? { ...p } : { id: null, name: '', aliases: [], category: 'Pantry', unit: 'unit', stock: 0, minStock: null, price: 0, cost: 0 }; render(); },
  closeSheet: (el, ev) => { if (ev.target.closest('[data-stop]') && el.classList.contains('sheetbg')) return; U.edit = null; render(); },
  saveP, delP: () => { if (!confirm('Delete this product and its history?')) return; const id = U.edit.id; S.products = S.products.filter(p => p.id !== id); S.moves = S.moves.filter(m => m.productId !== id); U.edit = null; save(); render(); },
  toggle: el => { S.settings[el.dataset.v] = !S.settings[el.dataset.v]; save(); el.classList.toggle('on'); },
  showkey: el => { const k = $('#key'); k.type = k.type === 'password' ? 'text' : 'password'; el.textContent = k.type === 'password' ? 'Show' : 'Hide'; },
  test: async () => { try { const r = await gemini([{ text: 'Reply with JSON {"ok":true}' }]); toast(r.ok ? '✅ Gemini connected' : 'Unexpected reply', r.ok ? 'ok' : 'warn'); } catch (e) { toast(e.message, 'err', 5000); } },
  export: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ ...S, settings: { ...S.settings, apiKey: '' } }, null, 2)], { type: 'application/json' })); a.download = `shelfsense-${new Date().toISOString().slice(0, 10)}.json`; a.click(); },
  reset: () => { if (confirm('Erase all products and sales on this device?')) { S.products = []; S.moves = []; U.ai.text = ''; save(); render(); toast('All data erased'); } }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'closeSheet' && el.classList.contains('sheetbg') && ev.target.closest('[data-stop]')) return;
  const f = ACT[el.dataset.a]; if (f) { ev.preventDefault(); f(el, ev); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { U.inv.q = t.value; $('#stocklist').innerHTML = stockList(); }
  if (t.dataset.det !== undefined) { const d = U.scan.dets[+t.dataset.det], k = t.dataset.k; d[k] = t.type === 'checkbox' ? t.checked : (t.type === 'number' ? (t.value === '' ? null : +t.value) : t.value); }
  if (t.dataset.pi !== undefined) { const it = U.voice.parsed.items[+t.dataset.pi]; it[t.dataset.k] = t.dataset.k === 'qty' ? +t.value : (t.value || null); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = t.type === 'number' ? (+t.value || 0) : t.value.trim(); save();
    $('#storeName').textContent = set().storeName; const pill = $('#enginePill'); pill.className = 'pill ' + (set().apiKey ? '' : 'off'); pill.innerHTML = `<i></i>${set().apiKey ? 'Gemini AI' : 'On-device'}`; }
  if (t.dataset.det !== undefined) { const d = U.scan.dets[+t.dataset.det];
    if (t.dataset.k === 'name') { const m = Core.matchProduct(d.name, S.products); d.matchId = m.product?.id || null; if (m.product && !d.price) d.price = m.product.price; render(); }
    else if (t.dataset.k === 'include') render(); }
  if (t.dataset.pk) { U.voice.parsed.intent = t.value; render(); }
  if (t.id === 'photoIn') { const fs = [...t.files].slice(0, 6); t.value = ''; if (fs.length) Promise.all(fs.map(f => fileToURL(f).then(d => resize(d)))).then(analyze).catch(e => toast(e.message, 'err')); }
  if (t.id === 'videoIn') { const f = t.files[0]; t.value = ''; if (!f) return; U.scan.busy = true; U.scan.status = 'Extracting frames from video…'; render(); frames(f, 5).then(fr => { U.scan.busy = false; analyze(fr); }).catch(e => { U.scan.busy = false; render(); toast(e.message, 'err'); }); }
  if (t.id === 'importIn') { const f = t.files[0]; t.value = ''; if (!f) return; f.text().then(x => { const d = JSON.parse(x); S.products = d.products || []; S.moves = d.moves || []; if (d.settings) Object.assign(S.settings, { ...d.settings, apiKey: S.settings.apiKey }); save(); render(); toast('Imported', 'ok'); }).catch(() => toast('Invalid file', 'err')); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'typed') ACT.typed(); if (ev.key === 'Escape' && U.edit) { U.edit = null; render(); } });

/* ---------- firebase cloud sync (AI Builder Cup: deployed on Firebase) ----
   Anonymous auth + one Firestore doc per device-user. Newest state wins on
   boot (savedAt); afterwards every save() mirrors to the cloud (debounced)
   and remote writes that are NEWER than local apply live — multi-device
   sync for free. No config / no network = the app stays local-only. */
window.__cloudPut = null;
(function cloud() {
  const FB = window.__firebase, cfg = window.FIREBASE_CONFIG || {};
  const pillEl = $('#cloudPill');
  const setPill = (on, label) => { pillEl.style.display = ''; pillEl.className = 'pill ' + (on ? '' : 'off'); pillEl.innerHTML = '<i></i>' + label; };
  if (!FB || !cfg.apiKey) return; // local-only mode: pill stays hidden
  let timer = null, uid = null, applying = false;
  const push = () => {
    if (!uid) return;
    clearTimeout(timer);
    timer = setTimeout(() => setDoc(FB.doc(FB.getFirestore(app), 'users', uid), JSON.parse(JSON.stringify(S))).catch(() => setPill(false, 'Cloud offline')), 1200);
  };
  window.__cloudPut = push;
  let app;
  try { app = FB.initializeApp(cfg); } catch (e) { return; }
  const db = FB.getFirestore(app);
  setPill(false, 'Connecting…');
  FB.signInAnonymously(FB.getAuth(app)).catch(() => setPill(false, 'Local'));
  FB.onAuthStateChanged(FB.getAuth(app), async (u) => {
    if (!u) { uid = null; setPill(false, 'Local'); return; }
    uid = u.uid;
    const ref = FB.doc(db, 'users', uid);
    try {
      const snap = await FB.getDoc(ref);
      if (snap.exists() && (snap.data().savedAt || 0) > (S.savedAt || 0)) {
        const d = snap.data();
        S.products = d.products || []; S.moves = d.moves || [];
        S.settings = Object.assign({}, DEF, d.settings || {});
        save(); render();
        toast('☁️ Loaded newer data from the cloud', 'ok');
      }
      setPill(true, 'Cloud');
      // live sync: a remote write newer than local applies (our own echoes
      // are older-or-equal and skipped)
      FB.onSnapshot(ref, (doc2) => {
        if (!doc2.exists() || applying) return;
        const d = doc2.data();
        if ((d.savedAt || 0) > (S.savedAt || 0)) {
          applying = true;
          S.products = d.products || []; S.moves = d.moves || [];
          S.settings = Object.assign({}, DEF, d.settings || {});
          save(); render(); applying = false;
        }
      });
    } catch (e) { setPill(false, 'Cloud offline'); }
  });
})();

/* boot */
$('#logo').innerHTML = I.logo;
document.querySelectorAll('.nav button').forEach(b => { const ic = { home: I.home, scan: I.scan, sell: I.mic, stock: I.box, settings: I.gear }[b.dataset.v]; b.insertAdjacentHTML('afterbegin', b.dataset.v === 'sell' ? `<span class="fabm">${ic}</span>` : ic); });
render();
setInterval(() => { if (U.tab === 'home' && !U.edit && !U.ai.busy && document.visibilityState === 'visible' && !document.activeElement?.matches('input,select')) render(); }, 60000);
})();
